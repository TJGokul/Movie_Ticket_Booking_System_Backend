services:
  postgres-db:
    image: postgres:16-alpine
    container_name: movie_booking_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: movie_booking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d movie_booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: movie_booking_app
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/movie_booking_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      PORT: 8080

volumes:
  pgdata:
